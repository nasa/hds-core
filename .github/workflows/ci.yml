# ci.yml
# PR gate -- runs on every pull request to main.
# Jobs are path-filtered so only relevant checks run for each PR.
#
# Every external action is pinned to a full commit SHA; the trailing
# comment records the human-readable version that SHA corresponds to.
# Dependabot (.github/dependabot.yml, github-actions ecosystem, weekly)
# maintains both -- it bumps the SHA and rewrites the comment, so updates
# still arrive as reviewable PRs. Dependabot does NOT convert tags to
# SHAs; it preserves whichever reference style it finds. Keep new actions
# SHA-pinned when you add them, or they stay on a mutable tag forever.
# Local composite actions (uses: ./.github/actions/*) have no SHA to pin.
#
# Artifact strategy: the build job uploads dist/ as a single artifact. Jobs
# that need dist/ on their own runner (test, chromatic) download it instead
# of rebuilding. build-storybook is the exception -- it also triggers on
# mdx/storybook-config changes where build doesn't run, so it always does
# its own full build via the shared composite.
#
# Visual-regression gate: Chromatic runs a full build only when the PR changes
# something a snapshot can see. detect-visual-change compares one fingerprint
# (scripts/visual-fingerprint.sh: compiled CSS, built JS/assets, story sources
# and Storybook config) between base and PR. The chromatic job then compares
# it against the last clean Chromatic build on this PR and skips the rebuild
# when nothing moved, so rebases and doc-only pushes cost no snapshots.
#
# Toolchain gate: a dependency or CI-definition change runs every job and
# every lint step (see the `toolchain` filter).

name: CI

on:
  pull_request:
    # ready_for_review is required so draft-gated jobs run when a draft is
    # marked ready (it is not one of the default activity types).
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

# Cancel a PR's previous in-flight run when a new commit is pushed. Keyed on
# the PR number (falls back to ref for non-PR runs) so unrelated PRs don't
# cancel each other. Frees runner slots instead of building superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # -----------------------------------------------------------------------
  # Filter -- determines which jobs (and which lint/build steps) run based
  # on what changed.
  #
  # `output_affecting` gates the build job and the contract checks inside it.
  # Use it -- not `scss` -- for anything that validates the published
  # artifact. A build-pipeline change (postcss plugin, Style Dictionary
  # config) or a package.json `files`/`exports` change moves what ships
  # without touching a .scss file, and gating those checks on `scss` alone
  # let PR #175 through with every output check reported as skipped.
  #
  # `toolchain` (dependencies, CI definition) can break any check, so every
  # job and lint step ORs it in.
  # -----------------------------------------------------------------------
  filter:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scss: ${{ steps.filter.outputs.scss }}
      js: ${{ steps.filter.outputs.js }}
      json: ${{ steps.filter.outputs.json }}
      md: ${{ steps.filter.outputs.md }}
      mdx: ${{ steps.filter.outputs.mdx }}
      stories: ${{ steps.filter.outputs.stories }}
      storybook_config: ${{ steps.filter.outputs.storybook_config }}
      tokens: ${{ steps.filter.outputs.tokens }}
      output_affecting: ${{ steps.filter.outputs.output_affecting }}
      toolchain: ${{ steps.filter.outputs.toolchain }}
      visual_inputs: ${{ steps.filter.outputs.visual_inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Filter names use underscores, not hyphens: a hyphenated output is
          # read as subtraction in `${{ ... }}` expressions and never matches.
          filters: |
            scss:
              - 'src/scss/**'
              - 'tokens.json'
            js:
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
            json:
              - '**/*.json'
              - '!package-lock.json'
            md:
              - '**/*.md'
            mdx:
              - 'stories/**/*.mdx'
            stories:
              - '**/*.stories.js'
            storybook_config:
              - '.storybook/**'
              # Storybook-only gates; not otherwise matched by a filter that runs build-storybook.
              - 'scripts/check-docs-render.js'
              - 'scripts/generate-llms.mjs'
            tokens:
              - 'tokens.json'
              - '.config/sd.config.js'
            # Anything that can change the published artifact -- compiled CSS,
            # the asset tree, or the packed tarball. Gates the build job, the
            # contract checks inside it (bundle size, public API snapshot), and
            # the detect-visual-change VR trigger. Deliberately wider than `scss`:
            # the build pipeline itself (postcss config and plugins, Style
            # Dictionary config, the sprite config) moves output without a
            # single .scss file changing, and package.json `files`/`exports`
            # move what ships without moving CSS at all. src/assets feeds
            # dist/ (copy:hds + sprite) without touching .scss, and scripts/
            # holds the check gates themselves -- an edit to any of those must
            # run the build and contract checks it controls.
            output_affecting:
              - 'src/scss/**'
              - 'src/assets/**'
              - 'tokens.json'
              - 'package.json'
              - '.config/**'
              - 'scripts/**'
            # Dependencies and the CI definition. Runs everything.
            toolchain:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.github/actions/**'
            # Story sources and Storybook config a snapshot can render. Excludes
            # .mdx so docs edits don't trigger a Chromatic build.
            visual_inputs:
              - 'stories/**/*.js'
              - 'stories/**/*.jsx'
              - 'stories/assets/**'
              - '.storybook/**'

  # -----------------------------------------------------------------------
  # Lint -- one runner for every linter. The lockfile check always runs
  # (fast supply-chain gate); the rest run only when their file types
  # changed. Each conditional step is guarded with !cancelled() so one
  # linter failing doesn't hide the others -- you still get every linter's
  # result in a single pass. Token drift lives here too: it needs
  # node_modules (Style Dictionary), not the compiled dist/.
  #
  # The token drift step keeps the scss filter (not just tokens) so a
  # hand-edit directly to a generated file -- which wouldn't touch
  # tokens.json/.config/sd.config.js -- still gets caught.
  # -----------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Lockfile lint
        run: npm run lint:lockfile

      - name: Stylelint
        if: ${{ !cancelled() && (needs.filter.outputs.scss == 'true' || needs.filter.outputs.toolchain == 'true') }}
        run: npm run lint:scss

      - name: ESLint
        if: ${{ !cancelled() && (needs.filter.outputs.js == 'true' || needs.filter.outputs.json == 'true' || needs.filter.outputs.toolchain == 'true') }}
        run: npm run lint:js

      - name: remark-lint (Markdown)
        if: ${{ !cancelled() && (needs.filter.outputs.md == 'true' || needs.filter.outputs.toolchain == 'true') }}
        run: npm run lint:md

      - name: remark-lint (MDX)
        if: ${{ !cancelled() && (needs.filter.outputs.mdx == 'true' || needs.filter.outputs.toolchain == 'true') }}
        run: npm run lint:mdx

      - name: Prettier format check
        if: ${{ !cancelled() && (needs.filter.outputs.md == 'true' || needs.filter.outputs.mdx == 'true' || needs.filter.outputs.js == 'true' || needs.filter.outputs.json == 'true' || needs.filter.outputs.toolchain == 'true') }}
        run: npm run format

      - name: Token generation drift
        if: ${{ !cancelled() && (needs.filter.outputs.tokens == 'true' || needs.filter.outputs.scss == 'true' || needs.filter.outputs.toolchain == 'true') }}
        run: npm run check:tokens

  # -----------------------------------------------------------------------
  # Build -- compiles CSS/assets, then runs the checks that only need the
  # freshly built dist/ (bundle size, public API snapshot, CSS-output hash)
  # as in-job steps, so they don't each spin a separate runner and
  # re-download an artifact. Uploads dist/ for the jobs that genuinely run
  # on their own runner (test, chromatic).
  #
  # Coupling note: because these checks run here, a failure in any of them
  # fails this job and skips the downstream jobs that need dist/. That is
  # intentional -- a public-API, bundle, or CSS-baseline regression is
  # merge-blocking anyway -- but it is the one behavioral change from the
  # previous per-check-job layout.
  # -----------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 15
    if: |
      needs.filter.outputs.output_affecting == 'true' ||
      needs.filter.outputs.stories == 'true' ||
      needs.filter.outputs.js == 'true' ||
      needs.filter.outputs.toolchain == 'true' ||
      needs.filter.outputs.visual_inputs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: Check bundle size
        if: ${{ !cancelled() && (needs.filter.outputs.output_affecting == 'true' || needs.filter.outputs.toolchain == 'true') }}
        run: bash scripts/check-bundle-size.sh

      - name: Check public API snapshot
        if: ${{ !cancelled() && (needs.filter.outputs.output_affecting == 'true' || needs.filter.outputs.toolchain == 'true') }}
        run: npm run check:api-snapshot

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # -----------------------------------------------------------------------
  # Test -- downloads the dist artifact instead of rebuilding. Skips draft
  # PRs (heavy: Playwright browser install + browser-mode a11y run). The
  # browser binary is cached so most runs skip the ~100MB download.
  # -----------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [filter, build]
    timeout-minutes: 20
    if: |
      github.event.pull_request.draft == false &&
      (needs.filter.outputs.output_affecting == 'true' ||
      needs.filter.outputs.stories == 'true' ||
      needs.filter.outputs.js == 'true' ||
      needs.filter.outputs.toolchain == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Unit tests
        run: npx vitest run --project unit --reporter=dot

      - name: A11y tests
        run: npx vitest run --project storybook --reporter=dot

  # -----------------------------------------------------------------------
  # Build Storybook -- the build proves it compiles; the docs-render crawl
  # proves MDX pages don't throw at runtime (a page can compile but throw,
  # e.g. a <Canvas> referencing a deleted story). The crawl skips scss: a
  # style change can't throw a render error (that's Chromatic's lane), and
  # stories are already rendered by the vitest `storybook` project.
  #
  # Self-contained: doesn't reuse the build artifact, since it also runs on
  # mdx/storybook-config changes where the build job is skipped.
  # -----------------------------------------------------------------------
  build-storybook:
    name: Build / Storybook
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 15
    if: |
      github.event.pull_request.draft == false &&
      (needs.filter.outputs.mdx == 'true' ||
      needs.filter.outputs.stories == 'true' ||
      needs.filter.outputs.scss == 'true' ||
      needs.filter.outputs.storybook_config == 'true' ||
      needs.filter.outputs.toolchain == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Shared with the deploy-storybook workflow so the build sequence is
      # defined once. See .github/actions/build-storybook.
      - name: Build Storybook
        uses: ./.github/actions/build-storybook

      - name: Cache Playwright browsers
        if: ${{ needs.filter.outputs.mdx == 'true' || needs.filter.outputs.stories == 'true' || needs.filter.outputs.storybook_config == 'true' || needs.filter.outputs.toolchain == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: ${{ needs.filter.outputs.mdx == 'true' || needs.filter.outputs.stories == 'true' || needs.filter.outputs.storybook_config == 'true' || needs.filter.outputs.toolchain == 'true' }}
        run: npx playwright install chromium

      - name: Check docs render
        if: ${{ needs.filter.outputs.mdx == 'true' || needs.filter.outputs.stories == 'true' || needs.filter.outputs.storybook_config == 'true' || needs.filter.outputs.toolchain == 'true' }}
        run: npm run check:docs-render

      # Same generator the deploy runs, so a Storybook upgrade or MDX change
      # that breaks llms.txt fails here instead of after merge.
      - name: Generate llms.txt
        if: ${{ needs.filter.outputs.mdx == 'true' || needs.filter.outputs.stories == 'true' || needs.filter.outputs.storybook_config == 'true' || needs.filter.outputs.toolchain == 'true' }}
        run: npm run docs:llms

  # -----------------------------------------------------------------------
  # Detect visual change -- the Chromatic trigger. Builds base and PR fresh
  # (not against a committed baseline, which goes stale as main moves) and
  # compares their scripts/visual-fingerprint.sh output. Both sides use the
  # PR's copy of the script, so a change to the fingerprint compares like
  # with like.
  # -----------------------------------------------------------------------
  detect-visual-change:
    name: Detect visual change
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 15
    if: |
      needs.filter.outputs.output_affecting == 'true' ||
      needs.filter.outputs.toolchain == 'true' ||
      needs.filter.outputs.visual_inputs == 'true'
    outputs:
      visual_change: ${{ steps.compare.outputs.visual_change }}
      fingerprint: ${{ steps.pr.outputs.fingerprint }}
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pr

      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: base

      - name: Build + fingerprint base
        id: base
        working-directory: base
        run: |
          npm ci
          npm run build
          echo "fingerprint=$(bash ../pr/scripts/visual-fingerprint.sh .)" >> "$GITHUB_OUTPUT"

      - name: Build + fingerprint PR
        id: pr
        working-directory: pr
        run: |
          npm ci
          npm run build
          echo "fingerprint=$(bash scripts/visual-fingerprint.sh .)" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        run: |
          if [ "${{ steps.base.outputs.fingerprint }}" = "${{ steps.pr.outputs.fingerprint }}" ]; then
            echo "Nothing visual changed (${{ steps.pr.outputs.fingerprint }}). Chromatic will skip."
            echo "visual_change=false" >> "$GITHUB_OUTPUT"
          else
            echo "Visual inputs changed."
            echo "  base: ${{ steps.base.outputs.fingerprint }}"
            echo "  pr:   ${{ steps.pr.outputs.fingerprint }}"
            echo "visual_change=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Visual inputs changed"
              echo "Chromatic will run for this PR unless this exact fingerprint already passed cleanly on it (fork PRs run once a maintainer approves the workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # -----------------------------------------------------------------------
  # Chromatic. Fork PRs run this too, but the token only reaches them after a
  # maintainer approves the run -- enforced by the repo Setting "Require
  # approval for all outside collaborators"). DO NOT remove that Setting.
  # The token can only upload snapshots (not accept baselines or touch account
  # settings), so risk is low. Can be reset from the Chromatic Configure page.
  # Dependabot PRs use the Dependabot secret of the same name.
  #
  # TurboSnap is off (it can't trace the CSS Storybook loads from dist/), so
  # every build is full, ~177 snapshots.
  #
  # Re-run dedupe: if this fingerprint already had a clean build (0 changes,
  # 0 errors) on this PR, mark the commit passing with `skip` instead of
  # rebuilding. Only clean builds are recorded, because `skip` passes a
  # commit even with unreviewed changes.
  # -----------------------------------------------------------------------
  chromatic:
    name: Chromatic upload
    runs-on: ubuntu-latest
    needs: [filter, build, detect-visual-change]
    timeout-minutes: 15
    if: |
      github.event.pull_request.draft == false &&
      needs.detect-visual-change.outputs.visual_change == 'true'
    env:
      CLEAN_BUILD_KEY: chromatic-clean-${{ needs.detect-visual-change.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chromatic walks git history to find each story's baseline.
          fetch-depth: 0

      - name: Look up a clean build of this fingerprint
        id: clean
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .chromatic-clean
          key: ${{ env.CLEAN_BUILD_KEY }}
          lookup-only: true

      - name: Mark commit passing (already clean at this fingerprint)
        if: steps.clean.outputs.cache-hit == 'true'
        uses: chromaui/action@e50abd573c8a789526f165fec06137a7c21d7299 # v18.13.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          configFile: .config/chromatic.config.json
          skip: true

      - uses: ./.github/actions/setup
        if: steps.clean.outputs.cache-hit != 'true'

      - name: Download dist
        if: steps.clean.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Run Chromatic
        id: chromatic
        if: steps.clean.outputs.cache-hit != 'true'
        uses: chromaui/action@e50abd573c8a789526f165fec06137a7c21d7299 # v18.13.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # The CLI only auto-detects the config at the repo root.
          configFile: .config/chromatic.config.json

      # A build that didn't report counts leaves them unset, which never
      # equals '0', so it isn't recorded as clean.
      - name: Record clean build
        id: record
        if: |
          steps.clean.outputs.cache-hit != 'true' &&
          steps.chromatic.outputs.changeCount == '0' &&
          steps.chromatic.outputs.errorCount == '0'
        run: |
          mkdir -p .chromatic-clean
          echo "${{ steps.chromatic.outputs.buildUrl }}" > .chromatic-clean/build-url

      - name: Save clean-build marker
        if: steps.record.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .chromatic-clean
          key: ${{ env.CLEAN_BUILD_KEY }}

  # -----------------------------------------------------------------------
  # USWDS integrity -- runs on dependency changes (a USWDS bump can be
  # lockfile-only)
  # check:uswds-core  architectural gate: @use 'uswds-core' must emit no CSS
  # check:uswds       component tracker: USWDS Sass source unchanged
  # If either fails, do not merge until resolved per CONTRIBUTING.md.
  # -----------------------------------------------------------------------
  check-uswds:
    name: USWDS integrity
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 10
    if: needs.filter.outputs.toolchain == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Verify uswds-core emits no CSS
        run: npm run check:uswds-core

      - name: Verify USWDS packages unchanged
        run: npm run check:uswds
