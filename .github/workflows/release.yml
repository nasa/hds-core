# Runs on every push to main, as two jobs:
#   version  -- opens/updates the "Version Packages" PR while changesets exist,
#               and detects when a version bump has just landed on main. When a
#               bump lands it builds dist + SBOM once and uploads them.
#   publish  -- runs ONLY when a bump landed (the Version Packages PR was merged):
#               downloads the prebuilt dist + SBOM, publishes to npm, tags, and
#               creates the GitHub Release. Gated on the `npm-publish` environment.
#
# npm publish uses OIDC trusted publishing -- no NPM_TOKEN secret is stored.
# The id-token: write permission lets the runner mint an OIDC token that npm
# (>= 11.5.1) exchanges for a short-lived publish credential.

name: Release

on:
  push:
    branches:
      - main

# Default token scope for the version job. The publish job narrows this and
# adds id-token: write for OIDC, so only that job can mint an OIDC credential.
permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    if: "github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main'"
    outputs:
      released: ${{ steps.version-check.outputs.released }}
      version: ${{ steps.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Capture the committed version BEFORE changesets/action runs.
      # The action modifies package.json locally when it prepares the Version
      # Packages PR, so reading the file after the action would give the
      # bumped version even when no version bump was merged to main.
      - name: Capture committed package version
        id: committed-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Changesets -- manage Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          commit: 'chore: version packages'
          title: 'Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release should run only when a version bump just landed on main
      # (i.e., the Version Packages PR was merged). Detection: check whether an
      # exact tag for the committed version already exists. Using git tag -l
      # rather than git describe avoids a false-positive on repos with no prior
      # tags (git describe falls back to v0.0.0, which never matches a real
      # version).
      - name: Check if version was bumped
        id: version-check
        run: |
          CURRENT="${{ steps.committed-version.outputs.version }}"
          if git tag -l "v${CURRENT}" | grep -q "v${CURRENT}"; then
            echo "released=false" >> $GITHUB_OUTPUT
            echo "Tag v${CURRENT} already exists -- no release"
          else
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
            echo "No tag for v${CURRENT} found -- release will run"
          fi

      - name: Build
        if: steps.version-check.outputs.released == 'true'
        run: npm run build

      - name: Generate SBOM
        if: steps.version-check.outputs.released == 'true'
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: Upload release artifacts
        if: steps.version-check.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            dist
            sbom.json
          retention-days: 1
          include-hidden-files: true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.released == 'true'
    # Gates the release behind the npm-publish environment's required reviewers.
    environment: npm-publish
    # id-token: write (OIDC) is scoped to this job only -- the version job has no
    # need to mint a publish credential.
    permissions:
      contents: write
      id-token: write
    steps:
      # Checkout provides package.json, src/ (published Sass + assets), and
      # CHANGELOG.md; dist/ and sbom.json come from the version job's artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts

      # Trusted publishing needs npm >= 11.5.1; the Node runtime above ships an
      # older bundled npm, so upgrade before publishing. Pinned to a known-good
      # floor rather than @latest to keep publishes deterministic and guard
      # against a future npm release changing publish behavior.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # No NODE_AUTH_TOKEN: the OIDC token (id-token: write) authenticates the
      # publish, and npm attaches provenance automatically. --provenance is kept
      # explicit because npm has not always inferred it from the OIDC context.
      # --ignore-scripts skips the prepack rebuild: dist/ is already present from
      # the artifact, and node_modules was never installed in this job.
      #
      # The version-exists guard makes this job safe to re-run. Publishing to npm
      # and creating the git tag (in the Release step below) are not atomic: if a
      # later step fails after a successful publish, no tag is written, so the
      # next push to main re-detects the version as unreleased and re-enters this
      # job. Skipping when the version is already on npm lets that re-run finish
      # tagging and creating the Release instead of dying on a duplicate publish.
      - name: Publish to npm
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if npm view "@nasa-hds/core@${VERSION}" version > /dev/null 2>&1; then
            echo "@nasa-hds/core@${VERSION} is already on npm -- skipping publish"
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      - name: Get changelog entry
        run: |
          awk '/^## /{found++} found==1{print} found==2{exit}' CHANGELOG.md > release-notes.md

      - name: Create dist zip
        run: |
          cd dist && zip -r ../hds-core-v${{ needs.version.outputs.version }}-dist.zip . && cd ..

      # Adopters who can't use npm self-host the zip -- the docs rule out
      # CDNs -- so without a published digest they have no way to tell a
      # tampered or truncated download from a good one. Emit it twice: a
      # .sha256 file in `sha256sum -c` format for scripted verification, and
      # the bare hash in the release body so it can be eyeballed without
      # downloading a second file. See the No-Build Environments guide.
      - name: Checksum dist zip
        id: checksum
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ZIP="hds-core-v${VERSION}-dist.zip"
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "sha256=$(cut -d ' ' -f 1 "$ZIP.sha256")" >> "$GITHUB_OUTPUT"
          cat "$ZIP.sha256"

      - name: Append checksum to release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          ZIP="hds-core-v${VERSION}-dist.zip"
          {
            printf '\n## Verify your download\n\n'
            printf 'SHA-256 of `%s`:\n\n' "$ZIP"
            printf '```\n%s\n```\n\n' "$SHA256"
            printf 'Or download `%s.sha256` alongside the zip and run:\n\n' "$ZIP"
            printf '```sh\nsha256sum -c %s.sha256\n```\n' "$ZIP"
          } >> release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --notes-file release-notes.md \
            "hds-core-v${{ needs.version.outputs.version }}-dist.zip#dist artifacts" \
            "hds-core-v${{ needs.version.outputs.version }}-dist.zip.sha256#SHA-256 checksum" \
            "sbom.json#SBOM (CycloneDX)"
