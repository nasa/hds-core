version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      # Output-affecting packages get their own group at EVERY update level
      # (minor + major) because a bad bump can change what ships to adopters
      # or break the deployed docs site -- things CI does not fully catch, so
      # each needs a human look. Dependabot assigns a package to its most
      # specific matching group, so these claim their packages ahead of the
      # catch-all `non-breaking` group below.
      #
      # Storybook: powers the published documentation site. `build-storybook`
      # succeeding proves it compiled, not that the site renders correctly.
      storybook:
        patterns:
          - '@storybook/*'
          - '@chromatic-com/*'
          - 'storybook'
          - 'storybook-addon-*'
          - 'eslint-plugin-storybook'
      # style-dictionary generates the tokens -- a bump can silently change
      # generated output.
      style-dictionary:
        patterns:
          - 'style-dictionary'
      # postcss/cssnano/autoprefixer transform the CSS on the way to the
      # published artifact.
      postcss:
        patterns:
          - 'postcss'
          - 'postcss-*'
          - 'cssnano'
          - 'autoprefixer'
      # Everything else is pure dev tooling fully guarded by CI (linters,
      # vitest, playwright, prettier, remark, etc). One weekly PR for all of
      # their minor + patch bumps -- the single thing to skim-and-merge on
      # green each Friday. Majors are excluded so they surface as their own
      # PR for a deliberate look.
      non-breaking:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
      timezone: 'America/New_York'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'
